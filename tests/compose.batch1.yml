services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: photo_agent_batch1_test
      POSTGRES_USER: batch1
      POSTGRES_PASSWORD: batch1_test_only
    ports: ["127.0.0.1:55439:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batch1 -d photo_agent_batch1_test"]
      interval: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20
