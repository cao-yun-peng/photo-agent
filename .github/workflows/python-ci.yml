name: Python CI

on:
  pull_request:
    paths: ["app/**", "tests/**", "scripts/**", "alembic/**", "alembic.ini", "requirements.txt", ".github/workflows/python-ci.yml"]
  push:
    paths: ["app/**", "tests/**", "scripts/**", "alembic/**", "alembic.ini", "requirements.txt", ".github/workflows/python-ci.yml"]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: photo_agent_batch1_test
          POSTGRES_USER: batch1
          POSTGRES_PASSWORD: batch1_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U batch1 -d photo_agent_batch1_test"
          --health-interval 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://batch1:batch1_test_only@127.0.0.1:5432/photo_agent_batch1_test
      REDIS_URL: redis://127.0.0.1:6379/15
      PHOTO_AGENT_TEST_DATABASE_URL: postgresql+asyncpg://batch1:batch1_test_only@127.0.0.1:5432/photo_agent_batch1_test
      PHOTO_AGENT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET: batch1_test_only_secret_never_for_production
      OSS_BACKEND: mock
      MOCK_OSS_ENABLED: "true"
      DASHSCOPE_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check app tests scripts
      - name: Upgrade isolated database
        run: alembic upgrade head
      - name: Regression, real leases and schema drift contract
        run: pytest -q --junitxml=test-results/python.xml
      - name: Verify reversible additive migration
        run: |
          alembic downgrade 20260822_0002
          alembic upgrade head
          pytest -q tests/test_batch1_integration.py -k migration

      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-regression
          path: test-results/
