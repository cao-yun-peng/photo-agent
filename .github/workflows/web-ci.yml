name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - "app/api/**"
      - "app/schemas/**"
      - "app/services/**"
      - "app/workers/**"
      - "docker-compose.yml"
      - "docker-compose.web.yml"
      - "docker-compose.e2e.yml"
      - "Dockerfile"
      - ".env.example"
      - "README.md"
      - "docs/web-development.md"
      - ".github/workflows/web-ci.yml"
  push:
    paths:
      - "web/**"
      - "app/api/**"
      - "app/schemas/**"
      - "app/services/**"
      - "app/workers/**"
      - "docker-compose.yml"
      - "docker-compose.web.yml"
      - "docker-compose.e2e.yml"
      - "Dockerfile"
      - ".env.example"
      - "README.md"
      - "docs/web-development.md"
      - ".github/workflows/web-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Start mock delivery stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.web.yml -f docker-compose.e2e.yml up -d --build api worker web-runtime web-gateway
          docker compose -f docker-compose.yml -f docker-compose.web.yml -f docker-compose.e2e.yml exec -T api alembic upgrade head
          for attempt in {1..40}; do
            curl --fail --silent http://127.0.0.1:8080/api/ready && exit 0
            sleep 3
          done
          exit 1
      - run: npm run test:e2e
        working-directory: web
        env:
          CI: "true"
          WEB_BASE_URL: http://127.0.0.1:8080
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
      - name: Backend logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.web.yml -f docker-compose.e2e.yml logs --no-color --tail=300 api worker web-runtime web-gateway
      - name: Stop mock backend
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.web.yml -f docker-compose.e2e.yml down -v

  delivery-image:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose -f docker-compose.yml -f docker-compose.web.yml config --quiet
      - name: Build Web runtime and Nginx gateway
        run: docker compose -f docker-compose.yml -f docker-compose.web.yml build web-runtime web-gateway
